location /33642f34/assets/ {
    alias /home/ubuntu/db_reader/.fam/frontend/dist/assets/;
    expires 5m;
    add_header Cache-Control "no-cache";
    add_header Access-Control-Allow-Origin "*";
    max_ranges 0;
    # Some ISP DPI paths stall the second response on a reused HTTP/1.1
    # connection. Close after each small asset so every part can complete.
    keepalive_timeout 0;
    keepalive_requests 1;
    types { text/javascript js; text/css css; }
    # Multipart files are inert transport text, not executable JavaScript.
    # Keeping them text/plain prevents over-eager ISP content inspection.
    default_type text/plain;
    # Russian mobile networks have been observed leaving gzip responses open
    # after the origin completed them. Multipart JS is already transport-sized.
    gzip off;
    gzip_static off;
    gzip_vary on;
    access_log /var/log/nginx/db-reader-access.log;
}

location = /33642f34/favicon.svg {
    alias /home/ubuntu/db_reader/.fam/frontend/dist/favicon.svg;
    expires 7d;
}

location = /33642f34/manifest.webmanifest {
    alias /home/ubuntu/db_reader/.fam/frontend/dist/manifest.webmanifest;
    default_type application/manifest+json;
    expires 1d;
}



location /33642f34/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    gzip_proxied any;
}

location /33642f34/api/auth/ {
    limit_req zone=espanol_auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:8010/api/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    gzip_proxied any;
}
